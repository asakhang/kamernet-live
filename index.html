<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kamernet Live has moved</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 32px 16px; font: 17px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText; }
  main { max-width: 32rem; margin: 0 auto; }
  a { font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Kamernet Live has moved</h1>
  <p>Its new address is <a id="go" href="https://asa-kamernet.github.io/">asa-kamernet.github.io</a>. Opening it now…</p>
</main>
<script>
// Moved 29 Oct 2026 to its own address, so other pages on asakhang.github.io can't read its storage.
// This page wipes what the old address saved (the passcode and view state) and forwards, keeping the #part
// (e.g. #l=123 from an alert). sw.js stays here so alerts on phones that turned them on here keep working.
try { ["kn_pass", "kn_state", "kn_todo_tab"].forEach((k) => localStorage.removeItem(k)); } catch {}
const to = "https://asa-kamernet.github.io/" + location.hash;
document.getElementById("go").href = to;
location.replace(to);
</script>
</body>
</html>
